<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XIX ғасыр мәдениеті</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: салтанатты, мұражай залындағыдай байсалды, бірақ жас оқушыға жылы
   IDEA: бет — қошқар мүйіз жиекті қызыл-көк текемет, әр параграф — оның бір өрнегі
   PICTURE: түнгі дала, киіз үй, үлкен домбыра; жиекте қошқар мүйіз өрнегі
   COLOUR+TYPE: терең көк (індиго) басым, текемет қызылы қолдау, алтын — жалғыз екпін; Montserrat
   LAYOUT: батыр баннер → 6 блок медальоны → блок ішінде: Сабақ / Карточка / Сәйкестендіру / Тексеру → қорытынды тест */
:root{color-scheme:light dark;
--bg:light-dark(#fbfaf6,#10142a);--card:light-dark(#ffffff,#181d38);--ink:light-dark(#1b1e2b,#ece8dc);--mut:light-dark(#5b5f70,#a9a8b8);
--ind:#1d2550;--ind2:light-dark(#e9ebf5,#222a52);--red:light-dark(#a3202a,#e0545c);--redbg:light-dark(#f8e6e6,#3a1a22);
--gold:#d6a43a;--goldbg:light-dark(#fbf1d9,#3a3220);--ok:light-dark(#1f7a4d,#5fd39a);--okbg:light-dark(#e3f4ea,#16352a);--line:light-dark(#e3e0d6,#2c3358)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Montserrat",system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:"Montserrat",system-ui,sans-serif;line-height:1.1;text-wrap:balance;margin:0}
button{font:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.band{padding:clamp(24px,4vw,56px) max(5vw,16px)}
.wrap{max-width:1180px;margin:0 auto}
.hero{background:var(--ind);color:#f3efe4;position:relative}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:28px;align-items:center}
.hero h1{font-size:clamp(32px,4.6vw,52px);color:#fff}
.hero p{color:#d6d3e6;max-width:52ch}
.hero .lbl{color:var(--gold);font-weight:700;margin:0 0 10px}
.hsvg{width:100%;height:auto;display:block;aspect-ratio:600/360}
.orn{height:26px;background:var(--red);display:block;width:100%}
.btn{border:0;border-radius:10px;padding:12px 20px;min-height:44px;font-weight:700;background:var(--gold);color:#1d2550}
.btn.ghost{background:transparent;color:inherit;border:2px solid currentColor}
.btn.sm{padding:8px 14px;min-height:40px;font-size:15px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.med{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;text-align:left;color:var(--ink);display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden}
.med:hover{border-color:var(--gold)}
.med .p{font-family:"Montserrat",sans-serif;font-size:28px;font-weight:700;color:var(--red)}
.med h3{font-size:19px}
.med small{color:var(--mut)}
.bar{height:8px;border-radius:9px;background:var(--ind2);overflow:hidden}.bar i{display:block;height:100%;background:var(--gold);border-radius:9px}
.med.fin{background:var(--red);color:#fff;border:0}.med.fin small{color:#f6d9d9}.med.fin .p{color:#fff}
.head{background:var(--ind);color:#fff}
.head h2{font-size:clamp(28px,3.6vw,44px);color:#fff}
.head .crumb{color:var(--gold);font-weight:700}
.head p{color:#d6d3e6;max-width:70ch}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0}
.tab{flex:none;border:0;background:rgba(255,255,255,.08);color:#e6e3f2;border-radius:10px 10px 0 0;padding:12px 18px;min-height:44px;font-weight:700}
.tab[aria-selected=true]{background:var(--bg);color:var(--ink)}
.ppl{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin:18px 0 28px}
.pc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.pc b{font-family:"Montserrat",sans-serif;font-size:19px;display:block}
.pc .y{color:var(--red);font-weight:700;font-size:15px}
.pc .pl{color:var(--mut);font-size:15px}
.pc p{margin:6px 0 0;font-size:16px}
.key{background:var(--goldbg);border-radius:14px;padding:16px 20px;margin:0 0 24px;border-left:0}
.key b{color:var(--red)}
table{border-collapse:collapse;width:100%;background:var(--card);border-radius:12px;overflow:hidden}
td,th{padding:10px 14px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:16px}
th{background:var(--ind2);font-family:"Montserrat",sans-serif}
td:first-child{font-weight:700;width:42%}
mark{background:var(--goldbg);color:inherit;padding:0 3px;border-radius:4px}
/* flashcards */
.fc{perspective:1200px;max-width:640px;margin:8px auto 14px}
.fci{position:relative;height:260px;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}
.fc.on .fci{transform:rotateY(180deg)}
.fs{position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px;font-size:20px}
.ff{background:var(--ind);color:#fff;font-family:"Montserrat",sans-serif;font-size:24px}
.fb{background:var(--card);border:2px solid var(--gold);transform:rotateY(180deg)}
.fs small{position:absolute;top:14px;left:18px;font-size:13px;opacity:.7;font-family:"Montserrat",sans-serif}
.ctr{justify-content:center}
/* match */
.mg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;max-width:820px;margin:0 auto}
.mi{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px 14px;min-height:56px;text-align:left;color:var(--ink);font-size:16px}
.mi.sel{border-color:var(--gold);background:var(--goldbg)}
.mi.done{border-color:var(--ok);background:var(--okbg);opacity:.75;cursor:default}
.mi.bad{border-color:var(--red);background:var(--redbg);animation:sh .35s}
@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
/* quiz */
.q{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin:0 0 16px}
.q h3{font-size:20px;margin-bottom:12px;font-family:"Montserrat",sans-serif}
.q .n{color:var(--red);font-weight:700;font-size:15px;display:block;margin-bottom:4px}
.op{display:block;width:100%;text-align:left;background:var(--bg);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:11px 14px;margin:8px 0;min-height:48px;font-size:16px}
.op:hover:not(:disabled){border-color:var(--gold)}
.op.r{border-color:var(--ok);background:var(--okbg)}.op.w{border-color:var(--red);background:var(--redbg)}.op.pick{border-color:var(--ind);background:var(--ind2)}
.op:disabled{cursor:default}
.ex{margin-top:10px;padding:10px 14px;border-radius:10px;background:var(--goldbg);font-size:15px}
.big{font-family:"Montserrat",sans-serif;font-size:clamp(44px,8vw,80px);font-weight:700;color:var(--red);line-height:1}
.pbar{height:10px;background:var(--ind2);border-radius:9px;overflow:hidden;margin:10px 0 18px}.pbar i{display:block;height:100%;background:var(--red);transition:width .3s}
.rows{display:grid;gap:8px;max-width:620px}
.rr{display:grid;grid-template-columns:minmax(0,9em) minmax(0,1fr) 3.5em;gap:10px;align-items:center;font-size:15px}
.rr span:last-child{text-align:right;font-variant-numeric:tabular-nums}
.note{color:var(--mut);font-size:14px}
.foot{background:var(--ind);color:#cfcce0;font-size:14px}
@media(max-width:760px){.hero .wrap{grid-template-columns:minmax(0,1fr)}.hsvg{max-width:520px}}
@media(max-width:600px){.mg{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}.mi{font-size:14px;padding:10px}.fci{height:300px}.fs{font-size:18px}.ff{font-size:21px}td,th{font-size:15px;padding:8px 10px}td:first-child{width:38%}}
@media(prefers-reduced-motion:reduce){.fci{transition:none}.mi.bad{animation:none}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<pattern id="qm" width="52" height="26" patternUnits="userSpaceOnUse">
<rect width="52" height="26" fill="#a3202a"/>
<path d="M26 22 V14 C26 6 16 4 13 10 C11 14 15 17 18 15 M26 14 C26 6 36 4 39 10 C41 14 37 17 34 15" fill="none" stroke="#d6a43a" stroke-width="2.4" stroke-linecap="round"/>
<path d="M0 24 H52" stroke="#d6a43a" stroke-width="1.2"/></pattern></defs></svg>
<main id="app"></main>
<footer class="foot band"><div class="wrap">Негізгі деректер «3-4 база смарт» конспектісінен алынды (§43–44, §46–52 және §53–54/§60 бөлімдері). Салт-дәстүрлер мен ұлттық ойындардың түсіндірмесі жалпы мәліметпен толықтырылды. Нәтижелерің осы браузерде ғана сақталады.</div></footer>

ppl:[['Т.У. Аткинсон','1799–1861','Ағылшын саяхатшысы, суретші','1848–1852 жж. Қазақстанда тарихи-этнографиялық, географиялық зерттеу жүргізді.'],

['Б. Залесский','1820–1880','Поляк суретшісі','1848–1849 жж. Бутаковтың Арал экспедициясында, 1853 ж. Ақмешітте болды.'],

  const b=B.find(x=>x.id===id); tab=tab||'les';

  <div class="tabs" role="tablist">${[['les','Сабақ'],['fc','Карточкалар'],['mt','Сәйкестендіру'],['qz','Блок тесті']].map(([k,n])=>`<button class="tab" role="tab" aria-selected="${k===tab}" data-tab="${k}">${n}</button>`).join('')}</div></div></section>${orn}
  <section class="band"><div class="wrap" id="pane"></div></section>`;
  app.querySelectorAll('[data-tab]').forEach(t=>t.onclick=()=>block(id,t.dataset.tab));
  const P=document.getElementById('pane');

  <h3 style="font-size:26px">Тұлғалар мен ұғымдар</h3>

  <table><thead><tr><th>Сұрақ</th><th>Жауап</th></tr></thead><tbody>${b.facts.map(f=>`<tr><td>${f[0]}</td><td>${f[1]}</td></tr>`).join('')}</tbody></table>
  <div class="row" style="margin-top:22px"><button class="btn" id="nx">Карточкалармен жаттау →</button>${i<5?`<button class="btn ghost sm" data-go="${B[i+1].id}">Келесі блок</button>`:`<button class="btn ghost sm" data-go="test">Қорытынды тест</button>`}</div>`;

function cards(b,P){
  let deck=sh(b.facts.map((f,k)=>k)),pos=0,known=new Set();
  const draw=()=>{
    if(pos>=deck.length){
      const left=b.facts.length-known.size;
      st[b.id]=st[b.id]||{};st[b.id].cards=Math.max(st[b.id].cards||0,known.size);save();
      P.innerHTML=`<div style="text-align:center"><div class="big">${known.size}/${b.facts.length}</div><p>карточканы білдің.</p><div class="row ctr">${left?`<button class="btn" id="rp">Білмегендерін қайталау (${left})</button>`:''}<button class="btn ghost sm" id="al">Бәрін басынан</button><button class="btn ghost sm" id="tq">Блок тестіне өту</button></div></div>`;
      if(left)P.querySelector('#rp').onclick=()=>{deck=sh(b.facts.map((f,k)=>k).filter(k=>!known.has(k)));pos=0;draw()};
      P.querySelector('#al').onclick=()=>{deck=sh(b.facts.map((f,k)=>k));pos=0;known=new Set();draw()};
      P.querySelector('#tq').onclick=()=>block(b.id,'qz');return}
    const f=b.facts[deck[pos]];
    P.innerHTML=`<p class="note" style="text-align:center">Карточканы басып, жауабын көр. Білсең — «Білемін», білмесең — «Қайталау».</p>
    <div class="pbar" style="max-width:640px;margin-inline:auto"><i style="width:${pos/deck.length*100}%"></i></div>
    <div class="fc" id="fc"><div class="fci" tabindex="0" role="button" aria-label="Карточканы аудару"><div class="fs ff"><small>${pos+1} / ${deck.length}</small>${f[0]}</div><div class="fs fb"><small>Жауабы</small>${f[1]}</div></div></div>
    <div class="row ctr"><button class="btn ghost sm" id="ag" style="color:var(--red)">Қайталау</button><button class="btn" id="kn">Білемін ✓</button></div>`;
    const c=P.querySelector('#fc'),ci=c.firstElementChild;
    ci.onclick=()=>c.classList.toggle('on');ci.onkeydown=e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();c.classList.toggle('on')}};
    P.querySelector('#kn').onclick=()=>{known.add(deck[pos]);pos++;draw()};
    P.querySelector('#ag').onclick=()=>{deck.push(deck[pos]);pos++;draw()};
  };draw();
}

function match(b,P){
  const ps=sh(b.pairs).slice(0,6);let L=ps.map((p,k)=>({t:p[0],k})),R=sh(ps.map((p,k)=>({t:p[1],k}))),sel=null,done=0,miss=0;
  P.innerHTML=`<p class="note" style="text-align:center">Сол жақтан тұлғаны не ұғымды таңда, сосын оң жақтан оған сәйкесін бас.</p>
  <div class="mg">${L.map((l,n)=>`<button class="mi" data-s="L" data-k="${l.k}">${l.t}</button><button class="mi" data-s="R" data-k="${R[n].k}">${R[n].t}</button>`).join('')}</div><p id="mres" style="text-align:center;margin-top:16px"></p>`;
  P.querySelectorAll('.mi').forEach(m=>m.onclick=()=>{
    if(m.classList.contains('done'))return;
    if(m.dataset.s==='L'){P.querySelectorAll('.mi[data-s=L]').forEach(x=>x.classList.remove('sel'));m.classList.add('sel');sel=m;return}
    if(!sel){m.classList.add('bad');setTimeout(()=>m.classList.remove('bad'),400);return}
    if(sel.dataset.k===m.dataset.k){sel.classList.replace('sel','done');m.classList.add('done');sel=null;done++;
      if(done===ps.length){const r=P.querySelector('#mres');r.innerHTML=`<b>Тамаша!</b> Қате саны: ${miss}. <button class="btn sm" id="ma">Жаңа жұптар</button>`;r.querySelector('#ma').onclick=()=>match(b,P)}}
    else{miss++;m.classList.add('bad');sel.classList.add('bad');const s=sel;setTimeout(()=>{m.classList.remove('bad');s.classList.remove('bad')},400)}
  });
}

function qcard(q,n,total,mode){
  const opts=sh(q[2].map((t,k)=>({t,ok:k===0})));
  return {opts,html:`<div class="q"><span class="n">Сұрақ ${n} / ${total}${mode==='t'?' · '+B[q[0]-1].p:''}</span><h3>${q[1]}</h3>${opts.map((o,k)=>`<button class="op" data-k="${k}">${String.fromCharCode(65+k)}. ${o.t}</button>`).join('')}<div class="exw"></div></div>`};
}

function bquiz(b,P){
  const qs=sh(Q.filter(q=>q[0]===B.indexOf(b)+1)).slice(0,5);let score=0,ans=0;
  const built=qs.map((q,n)=>qcard(q,n+1,5,'b'));
  P.innerHTML=`<p class="note">Әр сұраққа бірден жауап пен түсіндірме шығады. Әр жолы сұрақтар мен нұсқалар араласады.</p>${built.map(x=>x.html).join('')}<div id="bres"></div>`;
  P.querySelectorAll('.q').forEach((qe,n)=>{const ops=qe.querySelectorAll('.op');ops.forEach(o=>o.onclick=()=>{
    const ch=built[n].opts[o.dataset.k];ops.forEach((x,k)=>{x.disabled=true;if(built[n].opts[k].ok)x.classList.add('r')});
    if(ch.ok)score++;else o.classList.add('w');
    qe.querySelector('.exw').innerHTML=`<div class="ex">${ch.ok?'<b>Дұрыс!</b> ':'<b>Қате.</b> '}${qs[n][3]}</div>`;
    if(++ans===5){st[b.id]=st[b.id]||{};st[b.id].quiz=Math.max(st[b.id].quiz||0,score);save();
      const r=document.getElementById('bres');const i=B.indexOf(b);
      r.innerHTML=`<div class="q" style="text-align:center"><div class="big">${score}/5</div><p>${score===5?'Өте жақсы — блокты меңгердің!':score>=3?'Жаман емес. Қате кеткен тақырыпты карточкамен қайтала.':'Сабақты қайта оқып, карточкалармен жатта.'}</p><div class="row ctr"><button class="btn sm" id="rq">Жаңа сұрақтармен қайта</button>${i<5?`<button class="btn ghost sm" data-go="${B[i+1].id}">Келесі блок →</button>`:`<button class="btn ghost sm" data-go="test">Қорытынды тест →</button>`}</div></div>`;
      r.querySelector('#rq').onclick=()=>bquiz(b,P);r.scrollIntoView({behavior:'smooth',block:'center'})}
  })});
}

  const draw=()=>{
    if(pos>=order.length)return result();
    const c=qcard(order[pos],pos+1,30,'t');
    T.innerHTML=`<div class="pbar"><i style="width:${pos/30*100}%"></i></div>${c.html}<div class="row" style="justify-content:space-between"><span class="note">Таңдағаннан кейін «Келесі» бас</span><button class="btn" id="nx" disabled style="opacity:.5">Келесі →</button></div>`;
    let ch=null;const nx=T.querySelector('#nx');
    T.querySelectorAll('.op').forEach(o=>o.onclick=()=>{T.querySelectorAll('.op').forEach(x=>x.classList.remove('pick'));o.classList.add('pick');ch=c.opts[o.dataset.k];nx.disabled=false;nx.style.opacity=1});
    nx.onclick=()=>{if(!ch)return;picks.push({q:order[pos],ch:ch.t,ok:ch.ok});pos++;draw();window.scrollTo({top:T.offsetTop-80})};
  };
  const result=()=>{
    const sc=picks.filter(p=>p.ok).length;st.test=Math.max(st.test||0,sc);save();
    const per=B.map((b,i)=>{const a=picks.filter(p=>p.q[0]===i+1);return [b,a.filter(p=>p.ok).length,a.length]});
    const wr=picks.filter(p=>!p.ok);
    const g=sc>=27?'Үздік! Тарих олимпиадасына дайынсың.':sc>=22?'Жақсы нәтиже. Төмендегі қателерді қарап шық.':sc>=15?'Орташа. Әлсіз блоктарды карточкамен қайтала.':'Сабақтарды қайта оқып, блок тестерінен баста.';
    T.innerHTML=`<div class="q" style="text-align:center"><div class="big">${sc}/30</div><p style="font-size:19px">${g}</p><p class="note">Ең жақсы нәтиже: ${st.test}/30</p></div>
    <h3 style="font-size:24px;margin:8px 0 12px">Блоктар бойынша</h3><div class="rows">${per.map(([b,o,a])=>`<div class="rr"><span>${b.p}</span><div class="bar"><i style="width:${o/a*100}%;background:${o/a>=.8?'var(--ok)':o/a>=.6?'var(--gold)':'var(--red)'}"></i></div><span>${o}/${a}</span></div>`).join('')}</div>
    ${wr.length?`<h3 style="font-size:24px;margin:28px 0 12px">Қателермен жұмыс (${wr.length})</h3>${wr.map(p=>`<div class="q"><span class="n">${B[p.q[0]-1].p}</span><h3>${p.q[1]}</h3><div class="op w" style="cursor:default">Сенің жауабың: ${p.ch}</div><div class="op r" style="cursor:default">Дұрыс жауап: ${p.q[2][0]}</div><div class="ex">${p.q[3]}</div></div>`).join('')}`:''}
    <div class="row" style="margin-top:16px"><button class="btn" id="rt">Жаңа 30 сұрақпен қайта тапсыру</button><a class="btn ghost sm" href="#top" style="text-decoration:none">Блоктарға оралу</a></div>`;
    T.querySelector('#rt').onclick=test;window.scrollTo({top:0});
  };
  draw();
}

function route(){
  const h=location.hash.slice(1);
  if(B.some(b=>b.id===h))block(h);else if(h==='test')test();else home();
  window.scrollTo({top:0});
}
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(!g)return;e.preventDefault();const t=g.dataset.go;if(location.hash==='#'+t)route();else location.hash=t});
window.addEventListener('hashchange',route);
route();
}
</script>
</body>
</html>
